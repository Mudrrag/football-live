
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080D10">
<meta name="description" content="مدرج الفهد Live — جدول المباريات وروابط المشاهدة">
<title>مدرج الفهد Live | The Cheetah</title>

<style>
:root{
 --bg:#080D10;
 --panel:#10191B;
 --line:#29413E;
 --accent:#00D6B8;
 --accent2:#C2FFF5;
 --silver:#C2D0CD;
 --text:#F3F7F6;
 --muted:#9EAFAB;
 --red:#FF424B;
}

*{box-sizing:border-box}

body{
 margin:0;
 min-height:100vh;
 background:
 radial-gradient(ellipse at 50% 0%,#123A35 0,transparent 48%),
 radial-gradient(ellipse at 90% 45%,#102522 0,transparent 42%),
 linear-gradient(180deg,#080D10,#0D1718 55%,#080D10);
 background-color:var(--bg);
 color:var(--text);
 font-family:Tahoma,Arial,sans-serif;
}

.wrap{width:min(1420px,94%);margin:auto}

header{
 position:relative;
 overflow:hidden;
 border-bottom:1px solid #24433E;
 background:rgba(8,13,16,.96);
}

header:after{
 content:"";
 position:absolute;
 bottom:0;left:0;right:0;height:3px;
 background:linear-gradient(90deg,transparent,#00D6B8,#C2FFF5,#00D6B8,transparent);
 opacity:1;
}

.top{
 min-height:300px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:20px;
 position:relative;
}

.brand{display:flex;align-items:center;gap:25px;min-width:0}

.cheetah{
 width:clamp(145px,29vw,390px);
 height:260px;
 flex:0 0 auto;
 background-color:#10191B;
 background-position:center 35%;
 background-size:cover;
 background-repeat:no-repeat;
 background-image:url("./cheetah.webp");
 mask-image:linear-gradient(90deg,#000 70%,transparent 100%);
 -webkit-mask-image:linear-gradient(90deg,#000 70%,transparent 100%);
 filter:contrast(1.12) saturate(.82);
}

.brand-copy{
 border-right:2px solid var(--accent);
 padding:8px 0 8px 22px;
}

.eyebrow{
 color:var(--accent);
 font-size:clamp(12px,1.5vw,19px);
 letter-spacing:6px;
 font-weight:700;
 margin:0 0 5px;
}

.brand h1{
 font-family:Arial,Tahoma,sans-serif;
 direction:ltr;
 text-align:right;
 line-height:.93;
 font-size:clamp(34px,6.2vw,82px);
 letter-spacing:1px;
 margin:0;
 font-weight:900;
}

.brand h1 .the{
 display:block;
 font-size:.34em;
 color:var(--silver);
 letter-spacing:7px;
 margin-bottom:9px;
}

.brand h1 .cheetah-word{display:block;color:#F3F7F6}

.brand h1 .live-word{
 display:block;
 color:var(--accent);
 font-size:.47em;
 letter-spacing:10px;
 margin-top:10px;
}

.subtitle{
 font-size:clamp(11px,1.4vw,16px);
 color:#AEBDB9;
 margin:14px 0 0;
}

.live-pill{
 align-self:flex-start;
 margin-top:28px;
 border:1px solid #315B53;
 border-radius:30px;
 padding:11px 17px;
 font-size:13px;
 white-space:nowrap;
 background:#10201E;
 color:#D8E7E3;
}

.live-pill i{
 display:inline-block;
 width:10px;height:10px;
 border-radius:50%;
 background:var(--accent);
 margin-left:8px;
 box-shadow:0 0 13px #00D6B8;
}

main{padding-bottom:28px}
.hero{padding:16px 0 12px}

.hero h2{
 font-size:clamp(20px,2.7vw,30px);
 margin:0 0 5px;
 line-height:1.5;
}

.hero h2 span{color:var(--accent)}

.toolbar{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:14px;
 flex-wrap:wrap;
 padding:12px 14px;
 border:1px solid #31504B;
 border-radius:18px;
 background:linear-gradient(135deg,#14211F,#10191B);
 margin:10px 0 5px;
 box-shadow:0 8px 28px #02080780;
}

.filters{display:flex;gap:9px;flex-wrap:wrap}

button{font:inherit;cursor:pointer}

.filter{
 min-width:112px;
 padding:12px 17px;
 border:1px solid #36504B;
 background:#172522;
 color:#E7F0ED;
 border-radius:13px;
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:9px;
 transition:all .2s ease;
}

.filter-symbol{
 font-size:22px;
 line-height:1;
 font-weight:900;
 display:inline-block;
 transform:scale(1.08);
}

.filter.active{
 color:#C2FFF5;
 border-color:#00D6B8;
 background:linear-gradient(135deg,#07594D,#123D36);
 font-weight:800;
 box-shadow:0 0 18px #00D6B833,inset 0 0 12px #00D6B822;
}

.filter:hover{
 border-color:var(--accent);
 color:var(--accent2);
}

.count{color:#D6E0DD;font-size:13px}
.count strong{color:var(--accent);font-size:19px}

.message{
 padding:15px 17px;
 margin:10px 0;
 border:1px solid #36504B;
 border-radius:13px;
 background:#14201E;
 color:var(--muted);
 line-height:1.8;
 font-size:14px;
}

.message.error{color:#FFB8BC;border-color:#874047}

.matches{
 display:flex;
 flex-direction:column;
 gap:7px;
 padding:0 0 18px;
}

.match{
 display:grid;
 grid-template-columns:minmax(175px,1.05fr) minmax(300px,2.1fr) minmax(150px,.85fr) minmax(150px,.9fr);
 align-items:center;
 gap:16px;
 min-height:108px;
 padding:13px 18px;
 background:linear-gradient(110deg,#101A1A,#142321 52%,#10191B);
 border:1px solid #304843;
 border-radius:16px;
 transition:border-color .2s,box-shadow .2s;
 box-shadow:0 5px 18px #02080760;
}

.match:hover{
 border-color:#00D6B8;
 box-shadow:0 0 20px #00D6B829;
}

.match.is-live{border-right:3px solid var(--red)}

.league-block{display:flex;align-items:center;gap:13px;min-width:0}

.league-symbol{
 width:49px;height:49px;
 flex:0 0 49px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:linear-gradient(145deg,#17443C,#102722);
 border:1px solid #39776A;
 color:var(--accent2);
 font-size:22px;
 font-weight:900;
}

.league-name{
 font-size:13px;
 font-weight:700;
 line-height:1.7;
 overflow-wrap:anywhere;
}

.league-sub{font-size:11px;color:#A5B8B2;margin-top:3px}

.teams{
 display:grid;
 grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
 gap:14px;
 align-items:center;
 text-align:center;
 min-width:0;
}

.team{
 font-weight:900;
 font-size:clamp(14px,1.7vw,22px);
 overflow-wrap:anywhere;
 line-height:1.5;
}

.vs{
 font:900 clamp(18px,2.2vw,28px)/1 Arial,sans-serif;
 color:var(--accent);
 direction:ltr;
}

.time-block{
 text-align:center;
 padding:2px 13px;
 border-right:1px solid #36504B;
 border-left:1px solid #36504B;
 min-width:0;
}

.time{
 font:700 clamp(21px,2.1vw,29px)/1.25 Arial,Tahoma,sans-serif;
 direction:ltr;
 white-space:nowrap;
}

.date{font-size:12px;color:var(--silver);margin-top:4px;line-height:1.7}

.status{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 gap:6px;
 margin-top:5px;
 padding:4px 11px;
 border:1px solid #34796B;
 border-radius:20px;
 color:#B5FFF1;
 background:#123B32;
 font-size:11px;
 font-weight:800;
 white-space:nowrap;
}

.status.live{
 color:#FF858B;
 background:#351A1D;
 border-color:#FF424B;
}

.status.finished{
 color:#C7D0CE;
 background:#242D2D;
 border-color:#566361;
}

/* زر المشاهدة - تصميم جلد الفهد ووجهه الحقيقي */
.watch{
 position:relative;
 isolation:isolate;
 overflow:hidden;
 width:100%;
 min-height:58px;
 border:1px solid #D8B36F;
 border-radius:13px;
 background-color:#B98D4D;
 background-image:
 radial-gradient(ellipse 9px 6px at 12% 25%,#704821 0 65%,transparent 73%),
 radial-gradient(ellipse 7px 9px at 24% 76%,#704821 0 65%,transparent 73%),
 radial-gradient(ellipse 11px 7px at 42% 17%,#704821 0 65%,transparent 73%),
 radial-gradient(ellipse 8px 10px at 53% 78%,#704821 0 65%,transparent 73%),
 radial-gradient(ellipse 10px 7px at 70% 25%,#704821 0 65%,transparent 73%),
 radial-gradient(ellipse 7px 9px at 83% 75%,#704821 0 65%,transparent 73%),
 linear-gradient(120deg,#D8B778,#A97839 55%,#D6B16D);
 color:#FFFFFF;
 font-size:13px;
 font-weight:900;
 padding:13px 78px 13px 12px;
 box-shadow:0 4px 16px #00000055;
 transition:filter .2s,transform .2s;
}

/* صورة وجه الفهد الحقيقي من cheetah.webp */
.watch:after{
 content:"";
 position:absolute;
 z-index:2;
 top:50%;
 right:5px;
 transform:translateY(-50%);
 width:66px;
 height:52px;
 border-radius:9px;
 border:1px solid #D8B36F;
 opacity:1;
 pointer-events:none;
 background-color:#342619;
 background-image:
 linear-gradient(180deg,#00000008,#00000035),
 url("./cheetah.webp");
 background-repeat:no-repeat;
 background-size:cover;
 background-position:center 35%;
 box-shadow:0 2px 9px #00000070;
}

/* المساحة الداكنة لعبارة المشاهدة */
.watch:before{
 content:"";
 position:absolute;
 z-index:1;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 width:calc(100% - 85px);
 height:70%;
 border:1px solid #D9B873;
 border-radius:9px;
 background:linear-gradient(110deg,#17130FEE,#292018F2);
 box-shadow:0 2px 8px #00000055;
 pointer-events:none;
}

.watch span{
 position:relative;
 z-index:3;
 display:inline-block;
 text-shadow:0 2px 4px #000000;
}

.watch:hover{
 filter:brightness(1.13);
 transform:translateY(-1px);
 box-shadow:0 5px 20px #00000080;
}

.watch:disabled{
 background:#252D2D;
 background-image:none;
 border-color:#414B4B;
 color:#929F9C;
 cursor:not-allowed;
 box-shadow:none;
}

.watch:disabled:before,
.watch:disabled:after{
 display:none;
}

.watch:disabled span{
 text-shadow:none;
}

footer{
 border-top:1px solid #29423D;
 text-align:center;
 padding:18px 0 25px;
 color:#AAB8B4;
 font-size:12px;
}

.footer-cheetah{color:var(--accent);margin:0 7px}
.hidden{display:none!important}

@media(max-width:900px){
 .top{min-height:235px}
 .cheetah{height:220px;width:clamp(125px,27vw,250px)}
 .brand{gap:12px}
 .match{grid-template-columns:minmax(140px,.8fr) minmax(240px,1.5fr) minmax(125px,.75fr)}
 .watch-wrap{grid-column:1/-1}
 .watch{padding:10px 78px 10px 12px}
 .time-block{border-left:0}
}

@media(max-width:620px){
 .wrap{width:94%}
 .top{min-height:190px;align-items:center;gap:5px}
 .brand{gap:3px}
 .cheetah{width:115px;height:170px}
 .brand-copy{padding:4px 10px 4px 0}
 .brand h1{font-size:clamp(27px,8vw,39px)}
 .brand h1 .the{letter-spacing:4px;margin-bottom:6px}
 .brand h1 .live-word{letter-spacing:6px;margin-top:6px}
 .subtitle{font-size:10px;margin-top:8px}
 .live-pill{
  position:absolute;
  top:8px;left:0;
  margin:0;
  font-size:10px;
  padding:7px 9px;
 }
 .hero{padding-top:13px}
 .hero h2{font-size:21px}
 .toolbar{padding:9px}
 .filters{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  width:100%;
  gap:7px;
 }
 .filter{min-width:0;padding:10px 7px;font-size:12px}
 .filter-symbol{font-size:23px}
 .count{font-size:12px}
 .match{
  grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);
  gap:10px;
  padding:12px 10px;
  min-height:0;
 }
 .league-block{gap:7px}
 .league-symbol{width:35px;height:35px;flex-basis:35px;font-size:16px}
 .league-name{font-size:11px}
 .league-sub{font-size:10px}
 .teams{gap:6px}
 .team{font-size:13px}
 .vs{font-size:15px}
 .time-block{
  grid-column:1/-1;
  border:0;
  border-top:1px solid #36504B;
  padding:9px 0 0;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
 }
 .time{font-size:21px}
 .date{font-size:11px;margin:0}
 .status{margin:0;font-size:10px}
 .watch-wrap{grid-column:1/-1}
 .watch{
  font-size:12px;
  padding:10px 78px 10px 12px;
  min-height:54px;
 }
 .watch:after{
  width:60px;
  height:48px;
 }
}
</style>
</head>

<body>
<header>
 <div class="wrap top">
  <div class="brand">
   <div class="cheetah" role="img" aria-label="صورة فهد حقيقي"></div>
   <div class="brand-copy">
    <h1>
     <span class="the">THE</span>
     <span class="cheetah-word">CHEETAH</span>
     <span class="live-word">LIVE</span>
    </h1>
    <p class="subtitle">مدرج الفهد — وجهتك لمتابعة المباريات</p>
   </div>
  </div>
  <div class="live-pill"><i></i> تغطية المباريات</div>
 </div>
</header>

<main class="wrap">
 <section class="hero">
  <h2>مدرج واحد لكل المباريات — <span>اختر وشاهد</span></h2>
 </section>

 <section class="toolbar" aria-label="تصفية المباريات">
  <div class="filters">
   <button class="filter active" data-filter="all" type="button">
    <span class="filter-symbol">▦</span> كل المباريات
   </button>
   <button class="filter" data-filter="live" type="button">
    <span class="filter-symbol">◉</span> مباشر
   </button>
   <button class="filter" data-filter="upcoming" type="button">
    <span class="filter-symbol">◷</span> قادمة
   </button>
   <button class="filter" data-filter="finished" type="button">
    <span class="filter-symbol">⚑</span> انتهت
   </button>
  </div>
  <div class="count" id="count"> </div>
 </section>

 <div id="message" class="message hidden" role="status"></div>
 <section id="matches" class="matches" aria-live="polite"></section>
</main>

<footer>
 © <span id="year"></span>
 <span class="footer-cheetah">♧</span>
 مدرج الفهد Live — جميع الحقوق محفوظة
</footer>

<script>
'use strict';

const SUPABASE_URL='https://mksjdavhrbtorkqoocez.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Ql5GPUQvGkh6oKwcoG7i7w_8K2DUX6s';

const message=document.getElementById('message');
const matchesEl=document.getElementById('matches');
const countEl=document.getElementById('count');
const filters=document.querySelectorAll('.filter');

let allMatches=[];
let currentFilter='all';

document.getElementById('year').textContent=new Date().getFullYear();

function normalizeStatus(value){
 const s=String(value??'').toLowerCase().trim();
 if(['live','مباشر','جارية','now'].includes(s))return 'live';
 if(['finished','ended','انتهت','منتهية','completed'].includes(s))return 'finished';
 return 'upcoming';
}

function statusLabel(s){
 if(s==='live')return '● مباشر';
 if(s==='finished')return 'انتهت';
 return '◷ قادمة';
}

function dateParts(value){
 if(!value)return {time:'--:--',date:'موعد غير محدد'};

 const d=new Date(value);
 if(Number.isNaN(d.getTime()))return {time:String(value),date:''};

 return {
  time:new Intl.DateTimeFormat('en-US',{
   hour:'2-digit',
   minute:'2-digit',
   hour12:true
  }).format(d),
  date:new Intl.DateTimeFormat('ar-SA',{
   day:'numeric',
   month:'long',
   year:'numeric'
  }).format(d)
 };
}

function leagueIcon(name){
 const s=String(name||'').toLowerCase();
 if(s.includes('روشن')||s.includes('سعود'))return '◉';
 if(s.includes('أبطال')||s.includes('champions'))return '✦';
 if(s.includes('إنجليزي')||s.includes('ممتاز')||s.includes('premier'))return '♛';
 if(s.includes('إسباني')||s.includes('لاليغا'))return '◈';
 if(s.includes('إيطالي'))return '◆';
 return '⚽';
}

function render(){
 const shown=allMatches.filter(m=>currentFilter==='all'||m.status===currentFilter);

 countEl.innerHTML='عدد المباريات: <strong>'+shown.length+'</strong>';
 matchesEl.replaceChildren();

 if(!shown.length){
  message.classList.remove('hidden','error');
  message.textContent=allMatches.length
   ?'ما فيه مباريات ضمن هذا التصنيف حاليًا.'
   :'ما فيه مباريات محفوظة حاليًا.';
  return;
 }

 message.classList.add('hidden');
 message.classList.remove('error');

 shown.forEach(m=>{
  const card=document.createElement('article');
  card.className='match'+(m.status==='live'?' is-live':'');

  const leagueBlock=document.createElement('div');
  leagueBlock.className='league-block';

  const symbol=document.createElement('div');
  symbol.className='league-symbol';
  symbol.textContent=leagueIcon(m.league);

  const leagueInfo=document.createElement('div');

  const league=document.createElement('div');
  league.className='league-name';
  league.textContent=m.league||'مباراة';

  const sub=document.createElement('div');
  sub.className='league-sub';
  sub.textContent='مدرج الفهد Live';

  leagueInfo.append(league,sub);
  leagueBlock.append(symbol,leagueInfo);

  const teams=document.createElement('div');
  teams.className='teams';

  const home=document.createElement('div');
  home.className='team';
  home.textContent=m.home||'الفريق الأول';

  const vs=document.createElement('div');
  vs.className='vs';
  vs.textContent='VS';

  const away=document.createElement('div');
  away.className='team';
  away.textContent=m.away||'الفريق الثاني';

  teams.append(home,vs,away);

  const timeBlock=document.createElement('div');
  timeBlock.className='time-block';

  const dt=dateParts(m.match_time);

  const time=document.createElement('div');
  time.className='time';
  time.textContent=dt.time;

  const date=document.createElement('div');
  date.className='date';
  date.textContent=dt.date;

  const badge=document.createElement('span');
  badge.className='status '+m.status;
  badge.textContent=statusLabel(m.status);

  timeBlock.append(time,date,badge);

  const watchWrap=document.createElement('div');
  watchWrap.className='watch-wrap';

  const watch=document.createElement('button');
  watch.className='watch';
  watch.type='button';

  const watchText=document.createElement('span');
  watchText.textContent=m.stream
   ?(m.status==='live'?'مشاهدة الآن  ▶':'مشاهدة المباراة  ▶')
   :'رابط المشاهدة غير متوفر';

  watch.append(watchText);
  watch.disabled=!m.stream;

  if(m.stream){
   watch.addEventListener('click',()=>{
    try{
     const u=new URL(m.stream);
     if(!['http:','https:'].includes(u.protocol))throw new Error();
     window.open(u.href,'_blank','noopener,noreferrer');
    }catch{
     alert('رابط المشاهدة غير صحيح. يرجى إبلاغ إدارة الموقع.');
    }
   });
  }

  watchWrap.append(watch);
  card.append(leagueBlock,teams,timeBlock,watchWrap);
  matchesEl.append(card);
 });
}

filters.forEach(b=>b.addEventListener('click',()=>{
 filters.forEach(x=>x.classList.toggle('active',x===b));
 currentFilter=b.dataset.filter;
 render();
}));

async function loadMatches(){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),15000);

 try{
  const endpoint=SUPABASE_URL+
   '/rest/v1/matches?select=id,home,away,league,match_time,status,stream&order=match_time.asc.nullsfirst';

  const response=await fetch(endpoint,{
   method:'GET',
   mode:'cors',
   cache:'no-store',
   signal:controller.signal,
   headers:{
    'apikey':SUPABASE_PUBLISHABLE_KEY,
    'Accept':'application/json'
   }
  });

  const body=await response.text();
  let data;

  try{
   data=body?JSON.parse(body):[];
  }catch{
   throw new Error('تعذر قراءة بيانات المباريات.');
  }

  if(!response.ok){
   throw new Error('تعذر تحميل المباريات حاليًا.');
  }

  if(!Array.isArray(data)){
   throw new Error('تعذر قراءة قائمة المباريات.');
  }

  allMatches=data.map(row=>({
   id:row.id,
   home:row.home,
   away:row.away,
   league:row.league,
   match_time:row.match_time,
   status:normalizeStatus(row.status),
   stream:typeof row.stream==='string'?row.stream.trim():''
  }));

  render();

 }catch(error){
  console.error('Matches API error:',error);
  matchesEl.replaceChildren();
  message.classList.remove('hidden');
  message.classList.add('error');

  if(error.name==='AbortError'){
   message.textContent='انتهت مهلة الاتصال. تحقق من الإنترنت ثم حدّث الصفحة.';
  }else{
   message.textContent='تعذر تحميل المباريات حاليًا. حاول تحديث الصفحة.';
  }

  countEl.textContent='تعذر تحميل المباريات';

 }finally{
  clearTimeout(timeout);
 }
}

loadMatches();

/* مزامنة تلقائية كل دقيقة */
setInterval(loadMatches,60000);
</script>
</body>
 </html>
