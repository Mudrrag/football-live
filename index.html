<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05090B">
<meta name="description" content="مدرج الفهد Live — جدول المباريات وروابط المشاهدة">
<title>مدرج الفهد Live | The Cheetah</title>
<style>
:root{--bg:#05090B;--panel:#0A1215;--line:#26383A;--accent:#00D6B8;--accent-soft:#A7F2E6;--text:#F2F6F5;--muted:#A5B2B0;--red:#FF424B}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,rgba(0,214,184,.13),transparent 48%),linear-gradient(180deg,#05090B,#080F12 58%,#05090B);color:var(--text);font-family:Tahoma,Arial,sans-serif}
.wrap{width:min(1420px,94%);margin:auto}
header{position:relative;overflow:hidden;border-bottom:1px solid #1A2B2D;background:rgba(5,9,11,.94)}
header:after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00D6B8 22%,#A7F2E6 50%,#00D6B8 78%,transparent)}
.top{min-height:300px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative}
.brand{display:flex;align-items:center;gap:25px;min-width:0}
.cheetah{width:clamp(145px,29vw,390px);height:260px;flex:0 0 auto;background:#0A1215 url("./cheetah.webp") center 35%/cover no-repeat;mask-image:linear-gradient(90deg,#000 70%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent 100%);filter:contrast(1.08) saturate(.88)}
.brand-copy{border-right:1px solid #00D6B8;padding:8px 0 8px 22px}
.eyebrow{color:var(--accent-soft);font-size:clamp(12px,1.5vw,19px);letter-spacing:6px;font-weight:700;margin:0 0 5px}
.brand h1{font-family:Arial,Tahoma,sans-serif;direction:ltr;text-align:right;line-height:.93;font-size:clamp(34px,6.2vw,82px);letter-spacing:1px;margin:0;font-weight:900}
.brand h1 .the{display:block;font-size:.34em;color:var(--accent-soft);letter-spacing:7px;margin-bottom:9px}
.brand h1 .cheetah-word{display:block;color:var(--text)}
.brand h1 .live-word{display:block;color:var(--accent);font-size:.47em;letter-spacing:10px;margin-top:10px}
.subtitle{font-size:clamp(11px,1.4vw,16px);color:#9AA9A7;margin:14px 0 0}
.live-pill{align-self:flex-start;margin-top:28px;border:1px solid #28504D;border-radius:30px;padding:11px 17px;font-size:13px;white-space:nowrap;background:rgba(10,18,21,.82);color:#DDE8E5}
.live-pill i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-left:8px;box-shadow:0 0 13px rgba(0,214,184,.75)}
main{padding-bottom:28px}
.hero{padding:16px 0 12px}
.hero h2{font-size:clamp(20px,2.7vw,30px);margin:0 0 5px;line-height:1.5}
.hero h2 span{color:var(--accent)}
.hero p{font-size:13px;color:var(--muted);line-height:1.8;margin:0}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(110deg,#0A1215,#0D181B);margin:10px 0 5px}
.filters{display:flex;gap:9px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.filter{min-width:112px;padding:12px 17px;border:1px solid #2B4142;background:#0B1518;color:#DCE7E4;border-radius:11px}
.filter.active{color:var(--accent);border-color:#00A991;background:linear-gradient(110deg,rgba(0,214,184,.16),rgba(0,214,184,.045));font-weight:800;box-shadow:inset 0 0 0 1px rgba(0,214,184,.08)}
.count{color:#D6E0DD;font-size:13px}
.count strong{color:var(--accent);font-size:17px}
.message{padding:15px 17px;margin:10px 0;border:1px solid var(--line);border-radius:13px;background:#0A1417;color:var(--muted);line-height:1.8;font-size:14px}
.message.error{color:#D5DEDC;border-color:#405052}
.matches{display:flex;flex-direction:column;gap:5px;padding:0 0 18px}
.match{display:grid;grid-template-columns:minmax(175px,1.05fr) minmax(300px,2.1fr) minmax(150px,.85fr) minmax(150px,.9fr);align-items:center;gap:16px;min-height:108px;padding:13px 18px;background:linear-gradient(105deg,#080F12,#0D191C 54%,#080F12);border:1px solid #243638;border-radius:13px;transition:border-color .15s}
.match:hover{border-color:#00A991}
.match.is-live{border-right:3px solid var(--red)}
.league-block{display:flex;align-items:center;gap:13px;min-width:0}
.league-symbol{width:49px;height:49px;flex:0 0 49px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#102326,#0A1518);border:1px solid #31514F;color:var(--accent);font-size:22px;font-weight:900;box-shadow:inset 0 0 16px rgba(0,214,184,.06)}
.league-name{font-size:13px;font-weight:700;line-height:1.7;overflow-wrap:anywhere;color:#EDF3F1}
.league-sub{font-size:11px;color:#91A19E;margin-top:3px}
.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center;text-align:center;min-width:0}
.team{font-weight:900;font-size:clamp(14px,1.7vw,22px);overflow-wrap:anywhere;line-height:1.5}
.vs{font:900 clamp(18px,2.2vw,28px)/1 Arial,sans-serif;color:var(--accent);direction:ltr}
.time-block{text-align:center;padding:2px 13px;border-right:1px solid #2B4142;border-left:1px solid #2B4142;min-width:0}
.time{font:700 clamp(21px,2.1vw,29px)/1.25 Arial,Tahoma,sans-serif;direction:ltr;white-space:nowrap}
.date{font-size:12px;color:var(--accent);margin-top:4px;line-height:1.7}
.status{display:inline-flex;align-items:center;justify-content:center;gap:6px;margin-top:5px;padding:4px 11px;border:1px solid #287D72;border-radius:20px;color:#8CEBDD;background:#0B2927;font-size:11px;font-weight:800;white-space:nowrap}
.status.live{color:#FF6971;background:#260D11;border-color:#8B2933}
.status.finished{color:#C2CECA;background:#141D1E;border-color:#3B4A49}
.watch{width:100%;border:1px solid #00A991;border-radius:9px;background:linear-gradient(110deg,#007F70,#00A991);color:#F3FFFD;font-size:13px;font-weight:900;padding:13px 10px;box-shadow:0 5px 18px rgba(0,214,184,.10)}
.watch:disabled{background:#141E20;border-color:#344544;color:#8B9A97;cursor:not-allowed}
footer{border-top:1px solid #1A2B2D;text-align:center;padding:18px 0 25px;color:#9AA9A7;font-size:12px}
.footer-cheetah{color:var(--accent);margin:0 7px}
.hidden{display:none!important}
@media(max-width:900px){
 .top{min-height:235px}
 .cheetah{height:220px;width:clamp(125px,27vw,250px)}
 .brand{gap:12px}
 .match{grid-template-columns:minmax(140px,.8fr) minmax(240px,1.5fr) minmax(125px,.75fr)}
 .watch-wrap{grid-column:1/-1}
 .watch{padding:10px}
 .time-block{border-left:0}
}
@media(max-width:620px){
 .wrap{width:94%}
 .top{min-height:190px;align-items:center;gap:5px}
 .brand{gap:3px}
 .cheetah{width:115px;height:170px}
 .brand-copy{padding:4px 10px 4px 0}
 .brand h1{font-size:clamp(27px,8vw,39px)}
 .brand h1 .the{letter-spacing:4px;margin-bottom:6px}
 .brand h1 .live-word{letter-spacing:6px;margin-top:6px}
 .subtitle{font-size:10px;margin-top:8px}
 .live-pill{position:absolute;top:8px;left:0;margin:0;font-size:10px;padding:7px 9px}
 .hero{padding-top:13px}
 .hero h2{font-size:21px}
 .hero p{font-size:11px}
 .toolbar{padding:9px}
 .filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%;gap:7px}
 .filter{min-width:0;padding:10px 7px;font-size:12px}
 .count{font-size:12px}
 .match{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;padding:12px 10px;min-height:0}
 .league-block{gap:7px}
 .league-symbol{width:35px;height:35px;flex-basis:35px;font-size:16px}
 .league-name{font-size:11px}
 .league-sub{font-size:10px}
 .teams{gap:6px}
 .team{font-size:13px}
 .vs{font-size:15px}
 .time-block{grid-column:1/-1;border:0;border-top:1px solid #2B4142;padding:9px 0 0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
 .time{font-size:21px}
 .date{font-size:11px;margin:0}
 .status{margin:0;font-size:10px}
 .watch-wrap{grid-column:1/-1}
 .watch{font-size:12px;padding:10px}
}
</style>
</head>
<body>
<header>
 <div class="wrap top">
  <div class="brand">
   <div class="cheetah" role="img" aria-label="صورة فهد حقيقي"></div>
   <div class="brand-copy">
    <h1><span class="the">THE</span><span class="cheetah-word">CHEETAH</span><span class="live-word">LIVE</span></h1>
    <p class="subtitle">مدرج الفهد — وجهتك لمتابعة المباريات</p>
   </div>
  </div>
  <div class="live-pill"><i></i> تغطية المباريات</div>
 </div>
</header>
<main class="wrap">
 <section class="hero">
  <h2>مدرج واحد لكل المباريات — <span>اختر وشاهد</span></h2>
  <p>جدول المباريات وروابط المشاهدة في مكان واحد. تتحدث القائمة من قاعدة بيانات الموقع.</p>
 </section>
 <section class="toolbar" aria-label="تصفية المباريات">
  <div class="filters">
   <button class="filter active" data-filter="all" type="button">▦ كل المباريات</button>
   <button class="filter" data-filter="live" type="button">◉ مباشر</button>
   <button class="filter" data-filter="upcoming" type="button">◷ قادمة</button>
   <button class="filter" data-filter="finished" type="button">⚑ انتهت</button>
  </div>
  <div class="count" id="count">جارٍ تحميل المباريات…</div>
 </section>
 <div id="message" class="message" role="status">جارٍ الاتصال بقاعدة البيانات…</div>
 <section id="matches" class="matches" aria-live="polite"></section>
</main>
<footer>© <span id="year"></span> <span class="footer-cheetah">♧</span> مدرج الفهد Live — جميع الحقوق محفوظة</footer>
<script>
'use strict';
const SUPABASE_URL='https://mksjdavhrbtorkqoocez.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_Ql5GPUQvGkh6oKwcoG7i7w_8K2DUX6s';
const message=document.getElementById('message');
const matchesEl=document.getElementById('matches');
const countEl=document.getElementById('count');
const filters=document.querySelectorAll('.filter');
let allMatches=[];
let currentFilter='all';
document.getElementById('year').textContent=new Date().getFullYear();

function normalizeStatus(value){
 const s=String(value??'').toLowerCase().trim();
 if(['live','مباشر','جارية','now'].includes(s))return 'live';
 if(['finished','ended','انتهت','منتهية','completed'].includes(s))return 'finished';
 return 'upcoming';
}
function statusLabel(s){
 if(s==='live')return '● مباشر';
 if(s==='finished')return 'انتهت';
 return '◷ قادمة';
}
function dateParts(value){
 if(!value)return {time:'--:--',date:'موعد غير محدد'};
 const d=new Date(value);
 if(Number.isNaN(d.getTime()))return {time:String(value),date:''};
 return {
  time:new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:true}).format(d),
  date:new Intl.DateTimeFormat('ar-SA',{day:'numeric',month:'long',year:'numeric'}).format(d)
 };
}
function leagueIcon(name){
 const s=String(name||'').toLowerCase();
 if(s.includes('روشن')||s.includes('سعود'))return '◉';
 if(s.includes('أبطال')||s.includes('champions'))return '✦';
 if(s.includes('إنجليزي')||s.includes('ممتاز')||s.includes('premier'))return '♛';
 if(s.includes('إسباني')||s.includes('لاليغا'))return '◈';
 if(s.includes('إيطالي'))return '◆';
 return '⚽';
}
function render(){
 const shown=allMatches.filter(m=>currentFilter==='all'||m.status===currentFilter);
 countEl.innerHTML='عدد المباريات: <strong>'+shown.length+'</strong>';
 matchesEl.replaceChildren();
 if(!shown.length){
  message.classList.remove('hidden','error');
  message.textContent=allMatches.length?'ما فيه مباريات ضمن هذا التصنيف حاليًا.':'ما فيه مباريات محفوظة حاليًا.';
  return;
 }
 message.classList.add('hidden');message.classList.remove('error');
 shown.forEach(m=>{
  const card=document.createElement('article');
  card.className='match'+(m.status==='live'?' is-live':'');
  const leagueBlock=document.createElement('div');leagueBlock.className='league-block';
  const symbol=document.createElement('div');symbol.className='league-symbol';symbol.textContent=leagueIcon(m.league);
  const leagueInfo=document.createElement('div');
  const league=document.createElement('div');league.className='league-name';league.textContent=m.league||'مباراة';
  const sub=document.createElement('div');sub.className='league-sub';sub.textContent='مدرج الفهد Live';
  leagueInfo.append(league,sub);leagueBlock.append(symbol,leagueInfo);
  const teams=document.createElement('div');teams.className='teams';
  const home=document.createElement('div');home.className='team';home.textContent=m.home||'الفريق الأول';
  const vs=document.createElement('div');vs.className='vs';vs.textContent='VS';
  const away=document.createElement('div');away.className='team';away.textContent=m.away||'الفريق الثاني';
  teams.append(home,vs,away);
  const timeBlock=document.createElement('div');timeBlock.className='time-block';
  const dt=dateParts(m.match_time);
  const time=document.createElement('div');time.className='time';time.textContent=dt.time;
  const date=document.createElement('div');date.className='date';date.textContent=dt.date;
  const badge=document.createElement('span');badge.className='status '+m.status;badge.textContent=statusLabel(m.status);
  timeBlock.append(time,date,badge);
  const watchWrap=document.createElement('div');watchWrap.className='watch-wrap';
  const watch=document.createElement('button');watch.className='watch';watch.type='button';
  watch.textContent=m.stream?(m.status==='live'?'مشاهدة الآن  ▶':'مشاهدة المباراة  ▶'):'رابط المشاهدة غير متوفر';
  watch.disabled=!m.stream;
  if(m.stream)watch.addEventListener('click',()=>{
   try{const u=new URL(m.stream);if(!['http:','https:'].includes(u.protocol))throw new Error();window.open(u.href,'_blank','noopener,noreferrer');}
   catch{alert('رابط المشاهدة غير صحيح. يرجى إبلاغ إدارة الموقع.');}
  });
  watchWrap.append(watch);card.append(leagueBlock,teams,timeBlock,watchWrap);matchesEl.append(card);
 });
}
filters.forEach(b=>b.addEventListener('click',()=>{
 filters.forEach(x=>x.classList.toggle('active',x===b));
 currentFilter=b.dataset.filter;render();
}));
async function loadMatches(){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),15000);
 message.classList.remove('hidden','error');
 message.textContent='جارٍ الاتصال بقاعدة البيانات…';
 try{
  const endpoint=SUPABASE_URL+'/rest/v1/matches?select=id,home,away,league,match_time,status,stream&order=match_time.asc.nullsfirst';
  const response=await fetch(endpoint,{
   method:'GET',
   mode:'cors',
   cache:'no-store',
   signal:controller.signal,
   headers:{
    'apikey':SUPABASE_PUBLISHABLE_KEY,
    'Accept':'application/json'
   }
  });
  const body=await response.text();
  let data;
  try{data=body?JSON.parse(body):[];}
  catch{throw new Error('استجابة قاعدة البيانات ليست بصيغة JSON.');}
  if(!response.ok){
   const detail=(data&&data.message)||('HTTP '+response.status);
   throw new Error(detail);
  }
  if(!Array.isArray(data))throw new Error('صيغة بيانات المباريات غير متوقعة.');
  allMatches=data.map(row=>({
   id:row.id,
   home:row.home,
   away:row.away,
   league:row.league,
   match_time:row.match_time,
   status:normalizeStatus(row.status),
   stream:typeof row.stream==='string'?row.stream.trim():''
  }));
  render();
 }catch(error){
  console.error('Matches API error:',error);
  matchesEl.replaceChildren();
  message.classList.remove('hidden');
  message.classList.add('error');
  if(error.name==='AbortError'){
   message.textContent='انتهت مهلة الاتصال بقاعدة البيانات. تحقق من الإنترنت ثم حدّث الصفحة.';
  }else if(error instanceof TypeError){
   message.textContent='تعذر الوصول إلى قاعدة البيانات. تحقق من اتصال الإنترنت أو إعدادات الوصول (RLS وData API).';
  }else{
   message.textContent='تعذر تحميل المباريات: '+(error.message||'خطأ غير معروف');
  }
  countEl.textContent='تعذر تحميل البيانات';
 }finally{
  clearTimeout(timeout);
 }
}
loadMatches();
/* مزامنة تلقائية كل دقيقة، مع تجنب تعدد الطلبات */
setInterval(loadMatches,60000);
</script>
</body>
 </html>
