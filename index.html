<!DOCTYPE html><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020b08">
<meta name="description" content="مدرج الفهد Live — جدول المباريات وروابط المشاهدة">
<title>مدرج الفهد Live | مباريات اليوم</title>
<style>
:root{--bg:#020b08;--panel:#061710;--panel2:#09251a;--line:#145536;--green:#00e676;--green2:#9affc3;--text:#f4fff8;--muted:#a4b9ad;--red:#ff454f;--gold:#efc56b}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background:radial-gradient(ellipse at 50% 0%,#0c3b25 0%,transparent 52%),linear-gradient(180deg,#020b08 0%,#04150e 60%,#010604 100%)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.22;background:repeating-linear-gradient(160deg,transparent 0 90px,#0b6538 92px,transparent 95px 170px);mask-image:linear-gradient(to bottom,black,transparent 75%)}
.wrap{width:min(1330px,94%);margin:auto}
header{padding:20px 0 18px;border-bottom:1px solid #10452b;background:#020b08e8;position:relative;overflow:hidden}
header:after{content:"";position:absolute;inset:auto 0 0;height:3px;background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:.65}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:20px;min-width:0}
.logo{width:116px;height:116px;flex:0 0 116px;display:grid;place-items:center}
.logo svg{width:100%;height:100%;filter:drop-shadow(0 0 12px #00e67620)}
.brand h1{font-size:clamp(28px,4.2vw,56px);margin:0;font-weight:900;letter-spacing:-1px}
.brand h1 span{color:var(--green)}
.subtitle{margin:10px 0 0;color:#b9c9c0;font-size:clamp(13px,1.6vw,18px)}
.underline{height:4px;width:80px;background:var(--green);border-radius:4px;margin-top:18px}
.pill{border:1px solid #2a4737;background:#04140d;color:#e5f5eb;padding:14px 20px;border-radius:999px;font-size:14px;white-space:nowrap}
.pill i{display:inline-block;width:10px;height:10px;background:var(--green);border-radius:50%;margin-left:8px;box-shadow:0 0 12px var(--green)}
.hero{padding:25px 0 18px}
.hero h2{font-size:clamp(23px,3.3vw,38px);margin:0 0 8px;line-height:1.5}
.hero h2 span{color:var(--green)}
.hero p{color:var(--muted);line-height:1.8;margin:0;font-size:14px}
.toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:14px 0 12px;padding:12px 16px;border:1px solid #123b28;background:#020e09e8;border-radius:16px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.filter{border:1px solid #173e2b;background:#071a11;color:#d6e7dc;border-radius:12px;padding:12px 22px;min-width:115px;transition:.16s}
.filter.active{background:linear-gradient(135deg,#00e676,#00b85c);border-color:var(--green);color:#032012;font-weight:900}
.count{color:#dcebe1;font-size:14px}
.count strong{color:var(--green);font-size:17px}
.message{padding:16px;border:1px solid #17462d;border-radius:14px;background:#06180f;color:var(--muted);line-height:1.9;margin:12px 0}
.message.error{border-color:#713838;color:#ffc1c1}
.matches{display:flex;flex-direction:column;gap:10px;padding:0 0 28px}
.match{display:grid;grid-template-columns:minmax(155px,1.05fr) minmax(290px,2.2fr) minmax(145px,.9fr) minmax(145px,.9fr);align-items:center;gap:15px;background:linear-gradient(105deg,#03140d,#041b11 55%,#03120c);border:1px solid #145334;border-radius:17px;padding:15px 18px;min-height:112px;box-shadow:0 10px 30px #0004;transition:transform .18s,border-color .18s;position:relative;overflow:hidden}
.match:hover{transform:translateY(-1px);border-color:#00b95e}
.match.live-match{border-right:4px solid var(--red)}
.league-block{display:flex;align-items:center;gap:12px;min-width:0}
.league-mark{width:47px;height:47px;flex:0 0 47px;display:grid;place-items:center;border-radius:50%;border:1px solid #2b5940;background:#0a2116;color:var(--green);font-size:19px;font-weight:900}
.league-name{font-weight:700;font-size:13px;line-height:1.7;overflow-wrap:anywhere}
.league-round{font-size:12px;color:var(--muted);margin-top:4px}
.teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:15px;text-align:center;min-width:0}
.team{font-weight:900;font-size:clamp(14px,1.7vw,21px);overflow-wrap:anywhere;line-height:1.45}
.vs{font-size:clamp(16px,2vw,25px);font-weight:900;color:var(--green);letter-spacing:.5px}
.time-block{text-align:center;border-right:1px solid #15432c;border-left:1px solid #15432c;padding:3px 12px;min-width:0}
.time{font-size:clamp(20px,2vw,27px);direction:ltr;white-space:nowrap}
.date{color:var(--green);font-size:13px;margin-top:4px;line-height:1.6}
.badge{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:800;border-radius:999px;padding:5px 11px;background:#0b3320;color:#80ffb2;border:1px solid #155a34;margin-top:6px}
.badge.live{background:#3a1115;color:#ff777e;border-color:#70262b}
.badge.finished{background:#18231d;color:#c1d1c7;border-color:#3b5145}
.watch{width:100%;border:0;border-radius:11px;padding:14px 10px;background:linear-gradient(110deg,#00c95d,#009c49);color:#f1fff5;font-weight:900;font-size:14px;box-shadow:0 5px 18px #00b85c17}
.watch:disabled{opacity:.45;cursor:not-allowed;background:#193126;color:#91a99a;box-shadow:none}
footer{text-align:center;color:#7e9b89;font-size:12px;line-height:2;padding:20px 0 28px;border-top:1px solid #153e29}
.footer-mark{color:var(--green);font-weight:900;margin:0 7px}
.hidden{display:none!important}
@media(max-width:900px){
 .match{grid-template-columns:minmax(140px,.8fr) minmax(230px,1.5fr) minmax(120px,.7fr);gap:12px}
 .watch-wrap{grid-column:1/-1}.watch{padding:11px}
 .time-block{border-left:0}
 .logo{width:90px;height:90px;flex-basis:90px}
}
@media(max-width:600px){
 .wrap{width:94%}header{padding:13px 0}
 .top{align-items:center}.brand{gap:10px}.logo{width:61px;height:61px;flex-basis:61px}
 .brand h1{font-size:clamp(23px,6vw,31px);letter-spacing:-.5px}.subtitle{font-size:11px;margin-top:5px}.underline{width:52px;margin-top:10px;height:3px}
 .pill{font-size:11px;padding:9px 11px}
 .hero{padding:21px 0 12px}.hero h2{font-size:24px}.hero p{font-size:12px}
 .toolbar{padding:10px;gap:11px}.filters{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
 .filter{min-width:0;padding:10px 8px;font-size:12px}.count{font-size:12px}
 .match{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;padding:13px;border-radius:14px}
 .league-block{gap:8px}.league-mark{width:36px;height:36px;flex-basis:36px;font-size:15px}
 .league-name{font-size:11px}.league-round{font-size:10px}
 .teams{gap:7px}.team{font-size:14px}.vs{font-size:14px}
 .time-block{grid-column:1/-1;border:0;border-top:1px solid #15432c;padding:10px 0 0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
 .time{font-size:20px}.date{font-size:11px;margin:0}.badge{margin:0;font-size:10px}
 .watch-wrap{grid-column:1/-1}.watch{font-size:12px;padding:11px}
}
</style>
</head>
<body>
<header>
 <div class="wrap top">
  <div class="brand">
   <div class="logo" aria-label="شعار الفهد">
    <svg viewBox="0 0 120 120" role="img" aria-label="رأس فهد داخل درع">
     <defs>
      <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b1"/><stop offset=".42" stop-color="#e8b95e"/><stop offset="1" stop-color="#8b551d"/></linearGradient>
      <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#00e676"/></linearGradient>
     </defs>
     <path d="M60 5 L72 19 L87 9 L91 28 L108 27 L103 46 L113 59 L101 74 L96 95 L78 108 L60 116 L42 108 L24 95 L19 74 L7 59 L17 46 L12 27 L29 28 L33 9 L48 19Z" fill="#04130b" stroke="url(#rim)" stroke-width="3"/>
     <path d="M32 37 L21 24 L42 30 L51 24 L60 31 L70 24 L79 30 L99 24 L88 41 L91 59 L83 80 L72 96 L60 105 L48 96 L37 80 L29 59Z" fill="url(#fur)" stroke="#221a0d" stroke-width="2.5" stroke-linejoin="round"/>
     <path d="M31 39 L22 31 L27 53 L37 58 L42 45Z M89 39 L98 31 L93 53 L83 58 L78 45Z" fill="#d49b44" stroke="#30200d" stroke-width="2"/>
     <path d="M37 42 L46 35 L53 43 L48 55 L38 54Z M68 43 L75 35 L84 42 L82 54 L72 55Z" fill="#14170f"/>
     <path d="M39 44 L47 42 L48 48 L41 49Z M72 48 L73 42 L81 44 L79 49Z" fill="#f5e9b8"/>
     <ellipse cx="45" cy="46" rx="2.5" ry="3.5" fill="#10120c"/><ellipse cx="75" cy="46" rx="2.5" ry="3.5" fill="#10120c"/>
     <path d="M45 58 Q60 48 75 58 L71 73 Q60 82 49 73Z" fill="#f4dca2" stroke="#68431c" stroke-width="1.5"/>
     <path d="M52 61 Q60 55 68 61 L64 67 L56 67Z" fill="#21170d"/>
     <path d="M60 67 L60 74 M60 74 Q52 81 47 74 M60 74 Q68 81 73 74" fill="none" stroke="#39220e" stroke-width="2" stroke-linecap="round"/>
     <g fill="#2b1a0b">
      <circle cx="37" cy="60" r="2.2"/><circle cx="42" cy="67" r="2"/><circle cx="49" cy="57" r="1.8"/><circle cx="33" cy="50" r="2"/><circle cx="83" cy="60" r="2.2"/><circle cx="78" cy="67" r="2"/><circle cx="71" cy="57" r="1.8"/><circle cx="87" cy="50" r="2"/><circle cx="54" cy="35" r="1.8"/><circle cx="66" cy="35" r="1.8"/><circle cx="60" cy="42" r="1.8"/>
     </g>
     <path d="M45 84 L52 89 L60 86 L68 89 L75 84 L70 98 L60 105 L50 98Z" fill="#0b2617" stroke="#d5a24d" stroke-width="1.5"/>
     <path d="M50 91 L60 95 L70 91" fill="none" stroke="#00e676" stroke-width="2"/>
    </svg>
   </div>
   <div>
    <h1>مدرج الفهد <span>Live</span></h1>
    <p class="subtitle">وجهتك لمتابعة المباريات</p>
    <div class="underline"></div>
   </div>
  </div>
  <div class="pill"><i></i> تغطية المباريات</div>
 </div>
</header>

<main class="wrap">
 <section class="hero">
  <h2>كل المباريات في مدرج واحد — <span>اختر وشاهد</span></h2>
  <p>جدول المباريات وروابط المشاهدة في مكان واحد. تتحدث القائمة من قاعدة بيانات الموقع.</p>
 </section>

 <section class="toolbar" aria-label="تصفية المباريات">
  <div class="filters">
   <button class="filter active" data-filter="all" type="button">كل المباريات</button>
   <button class="filter" data-filter="live" type="button">مباشر</button>
   <button class="filter" data-filter="upcoming" type="button">قادمة</button>
   <button class="filter" data-filter="finished" type="button">انتهت</button>
  </div>
  <div class="count" id="count">جارٍ تحميل المباريات…</div>
 </section>

 <div id="message" class="message" role="status">جارٍ الاتصال بقاعدة البيانات…</div>
 <section id="matches" class="matches" aria-live="polite"></section>
</main>

<footer>© <span id="year"></span> <span class="footer-mark">♛</span> مدرج الفهد Live — جميع الحقوق محفوظة</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const SUPABASE_URL = 'https://mksjdavhrbtorkqoocez.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Ql5GPUQvGkh6oKwcoG7i7w_8K2DUX6s';
const message = document.getElementById('message');
const matchesEl = document.getElementById('matches');
const countEl = document.getElementById('count');
const filters = document.querySelectorAll('.filter');
let allMatches = [];
let currentFilter = 'all';
document.getElementById('year').textContent = new Date().getFullYear();

function normalizeStatus(value) {
 const status = String(value ?? '').toLowerCase().trim();
 if (['live','مباشر','جارية','now'].includes(status)) return 'live';
 if (['finished','ended','انتهت','منتهية'].includes(status)) return 'finished';
 return 'upcoming';
}
function statusText(status) {
 if (status === 'live') return '● مباشر';
 if (status === 'finished') return 'انتهت';
 return '◷ قادمة';
}
function formatTime(value) {
 if (!value) return {time:'--:--',date:'موعد غير محدد'};
 const d = new Date(value);
 if (Number.isNaN(d.getTime())) return {time:String(value),date:''};
 return {
  time:new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d),
  date:new Intl.DateTimeFormat('ar-SA',{day:'numeric',month:'long',year:'numeric'}).format(d)
 };
}
function leagueMark(name) {
 const s = String(name || '').toLowerCase();
 if (s.includes('روشن') || s.includes('سعود')) return '◉';
 if (s.includes('أبطال') || s.includes('champions')) return '✦';
 if (s.includes('إنجليزي') || s.includes('ممتاز')) return '♛';
 if (s.includes('إسباني') || s.includes('لاليغا')) return '◈';
 if (s.includes('إيطالي')) return '◆';
 return '⚽';
}
function renderMatches() {
 const shown = allMatches.filter(m => currentFilter === 'all' || m.status === currentFilter);
 countEl.innerHTML = 'عدد المباريات: <strong>' + shown.length + '</strong>';
 matchesEl.replaceChildren();
 if (!shown.length) {
  message.classList.remove('hidden','error');
  message.textContent = allMatches.length ? 'ما فيه مباريات ضمن هذا التصنيف حاليًا.' : 'ما فيه مباريات محفوظة حاليًا.';
  return;
 }
 message.classList.add('hidden');
 message.classList.remove('error');
 shown.forEach(match => {
  const card = document.createElement('article');
  card.className = 'match' + (match.status === 'live' ? ' live-match' : '');

  const leagueBlock = document.createElement('div');
  leagueBlock.className = 'league-block';
  const mark = document.createElement('div');
  mark.className = 'league-mark';
  mark.textContent = leagueMark(match.league);
  const leagueInfo = document.createElement('div');
  const leagueName = document.createElement('div');
  leagueName.className = 'league-name';
  leagueName.textContent = match.league || 'مباراة';
  const round = document.createElement('div');
  round.className = 'league-round';
  round.textContent = 'مدرج الفهد Live';
  leagueInfo.append(leagueName, round);
  leagueBlock.append(mark, leagueInfo);

  const teams = document.createElement('div');
  teams.className = 'teams';
  const home = document.createElement('div');
  home.className = 'team';
  home.textContent = match.home || 'الفريق الأول';
  const vs = document.createElement('div');
  vs.className = 'vs';
  vs.textContent = 'VS';
  const away = document.createElement('div');
  away.className = 'team';
  away.textContent = match.away || 'الفريق الثاني';
  teams.append(home, vs, away);

  const timeBlock = document.createElement('div');
  timeBlock.className = 'time-block';
  const formatted = formatTime(match.match_time);
  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = formatted.time;
  const date = document.createElement('div');
  date.className = 'date';
  date.textContent = formatted.date;
  const badge = document.createElement('span');
  badge.className = 'badge ' + match.status;
  badge.textContent = statusText(match.status);
  timeBlock.append(time, date, badge);

  const watchWrap = document.createElement('div');
  watchWrap.className = 'watch-wrap';
  const watch = document.createElement('button');
  watch.className = 'watch';
  watch.type = 'button';
  watch.textContent = match.stream ? (match.status === 'live' ? 'مشاهدة الآن  ▶' : 'مشاهدة المباراة  ▶') : 'رابط المشاهدة غير متوفر';
  watch.disabled = !match.stream;
  if (match.stream) {
   watch.addEventListener('click', () => {
    try {
     const url = new URL(match.stream);
     if (!['http:','https:'].includes(url.protocol)) throw new Error();
     window.open(url.href, '_blank', 'noopener,noreferrer');
    } catch {
     alert('رابط المشاهدة غير صحيح. يرجى إبلاغ إدارة الموقع.');
    }
   });
  }
  watchWrap.appendChild(watch);
  card.append(leagueBlock, teams, timeBlock, watchWrap);
  matchesEl.appendChild(card);
 });
}
filters.forEach(button => button.addEventListener('click', () => {
 filters.forEach(item => item.classList.toggle('active', item === button));
 currentFilter = button.dataset.filter;
 renderMatches();
}));
async function loadMatches() {
 try {
  if (!window.supabase || !window.supabase.createClient) throw new Error('Supabase library unavailable');
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  const {data,error} = await db.from('matches')
   .select('id, home, away, league, match_time, status, stream')
   .order('match_time',{ascending:true,nullsFirst:false});
  if (error) throw error;
  allMatches = (data || []).map(row => ({
   id:row.id,home:row.home,away:row.away,league:row.league,
   match_time:row.match_time,status:normalizeStatus(row.status),stream:row.stream
  }));
  renderMatches();
 } catch (error) {
  console.error('Supabase load error:',error);
  allMatches = [];
  matchesEl.replaceChildren();
  message.classList.remove('hidden');
  message.classList.add('error');
  message.textContent = 'تعذر تحميل المباريات الآن. حاول تحديث الصفحة لاحقًا.';
  countEl.textContent = 'تعذر تحميل البيانات';
 }
}
loadMatches();
</script>
</body>
 </html>
